# Configuración Alembic para CRM RAH VZLA (Sprint 02)
[alembic]
script_location = %(here)s/alembic
version_locations = %(here)s/alembic/versions
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

# URL por defecto para desarrollo local (sobreescrita dinámicamente en env.py con DATABASE_URL)
sqlalchemy.url = postgresql+psycopg://rah_dev:dev_only_change_me@127.0.0.1:5432/rah_vzla

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
